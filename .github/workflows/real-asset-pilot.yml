name: real-asset-pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'content/asset-pilots/**'
      - 'content/rig-profiles/**'
      - 'scripts/real-asset-pilot.mjs'
      - 'scripts/animation-worklist.mjs'
      - 'scripts/import-fighter-model.mjs'
      - 'scripts/fighter-packs.mjs'
      - 'apps/asset-pilot-lab/**'
      - '.github/workflows/real-asset-pilot.yml'

jobs:
  riven-real:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser pilot dependencies
        run: npm install
      - name: Verify physical Riven GLB
        run: node scripts/real-asset-pilot.mjs riven-real
      - name: Generate animation worklist
        run: node scripts/animation-worklist.mjs riven-real
      - name: Certify model import and custom rig path
        run: |
          node scripts/import-fighter-model.mjs greybox https://raw.githubusercontent.com/mikeylambo/witch-hunter-x/main/public/assets/riven-rigged.glb mixamo-humanoid-v1 --author=SLU --license=Original-project-asset
          npm run fighter:check
          npm run rig:check
      - name: Build real asset pilot lab
        run: npx vite build apps/asset-pilot-lab --outDir ../../dist-asset-pilot-lab --emptyOutDir
