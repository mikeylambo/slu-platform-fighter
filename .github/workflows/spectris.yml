name: Spectris foundation
on:
  push:
    branches: ['feat/spectris-duellum', main]
  pull_request:
    paths: ['apps/spectris/**', 'packages/**', 'scripts/spectris-*.mjs', 'reference/**', 'package*.json']
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run spectris:verify-foundation
      - run: npm run spectris:reference
      - uses: actions/upload-artifact@v4
        with:
          name: spectris-foundation-proofs
          path: apps/spectris/proofs/
