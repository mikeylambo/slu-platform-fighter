<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SLU Platform Fighter — Movement Lab</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #090b10; color: #eef2ff; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      canvas { display: block; }
      #hud, #tuner { position: fixed; top: 16px; padding: 12px 14px; background: rgba(8,10,16,.86); border: 1px solid rgba(255,255,255,.16); border-radius: 8px; line-height: 1.45; }
      #hud { left: 16px; white-space: pre; pointer-events: none; }
      #tuner { right: 16px; width: min(330px, calc(100vw - 32px)); max-height: calc(100vh - 92px); overflow: auto; }
      #tuner h2 { margin: 0 0 8px; font-size: 14px; }
      .control { display: grid; grid-template-columns: 1fr 72px; gap: 8px; align-items: center; margin: 7px 0; font-size: 11px; }
      .control input[type="range"] { grid-column: 1 / -1; width: 100%; }
      .control output { text-align: right; }
      .buttons { display: flex; gap: 8px; margin-top: 12px; }
      button { flex: 1; background: #202838; color: #eef2ff; border: 1px solid rgba(255,255,255,.16); border-radius: 6px; padding: 7px; cursor: pointer; }
      #help { position: fixed; inset: auto 16px 16px 16px; padding: 10px 12px; background: rgba(8,10,16,.72); border: 1px solid rgba(255,255,255,.12); border-radius: 8px; text-align: center; pointer-events: none; }
      @media (max-width: 760px) { #tuner { top: auto; bottom: 58px; max-height: 42vh; } #hud { font-size: 10px; } }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <aside id="tuner"><h2>MOVEMENT RULES — LIVE LAB</h2><div id="controls"></div><div class="buttons"><button id="defaults">Defaults</button><button id="copy-rules">Copy JSON</button></div></aside>
    <div id="help">A/D or Left/Right: move · S/Down: crouch/drop/fastfall/ledge release · Space/J: jump · K: dodge/roll/air dodge · L: shield input · P: pause · .: frame step · R: reset · Gamepad: A jump / B dodge / RB shield</div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
