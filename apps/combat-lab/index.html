<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>SLU Platform Fighter — Combat Lab</title>
    <style>
      html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b10;color:#eef2ff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}canvas{display:block}

    <div id="hud"></div><div id="events">NO MATCH EVENTS YET</div>
    <div id="help">P1: A/D move · Space jump · F attack · E grab · K dodge · L shield · S down/fastfall · Dummy: H toggle shield · G jab · T grab · R reset · P pause · . frame step · Gamepad: Left stick / A jump / X attack / Y grab / B dodge / RB shield</div>
