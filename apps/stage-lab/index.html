<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SLU Stage Lab</title><style>body{margin:0;background:#0b0e13;color:#e9eef7;font-family:system-ui;display:grid;grid-template-columns:1fr 420px;height:100vh}main{display:flex;align-items:center;justify-content:center}canvas{width:100%;height:100%;background:#111722}aside{padding:16px;overflow:auto;border-left:1px solid #28303c}textarea{width:100%;height:65vh;background:#090c11;color:#d7e5ff;border:1px solid #354052;padding:10px;font:12px ui-monospace;box-sizing:border-box}button{margin:8px 8px 8px 0;padding:8px 12px}#status{white-space:pre-wrap;font:12px ui-monospace}</style></head><body><main><canvas id="view" width="1200" height="800"></canvas></main><aside><h1>Stage Lab</h1><p>Edit stage JSON, preview geometry/motion, then copy the pack back into <code>stages/&lt;id&gt;/stage.json</code>.</p><button id="apply">Apply / Validate</button><button id="copy">Copy JSON</button><input id="frame" type="range" min="0" max="480" value="0" style="width:100%"><div id="frameLabel">Frame 0</div><textarea id="json"></textarea><div id="status"></div></aside><script type="module" src="/main.ts"></script></body></html>
